; PlatformIO Project Configuration File for ESP32 NodeMCU
; Ideal if using VS Code (similar workflow to STM32CubeIDE / Eclipse)

[platformio]
src_dir = esp32_firmware

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
